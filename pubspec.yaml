
name: pawly
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_storage: ^14.0.1
  image_picker: ^1.2.4
  flutter_animate: ^4.5.2
  google_fonts: ^9.0.0
  http: ^1.6.0
  flutter_map: ^8.3.2
  flutter_map_vector_tiles: ^2.12.0
  latlong2: ^0.10.1
  geolocator: ^14.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/Pet1.png.png
    - assets/images/Pet2.png.png
    - assets/images/Pet3.png.png
    - assets/images/Pet4.png.png
    - assets/images/Pet5.png.png
    - assets/images/Pet6.png.png
    - assets/images/Pet7.png.png
